id: opnsense
name: OPNsense
version: 0.7.0
protocol: 1
entrypoint: main.py
timeout_s: 60
description: >-
  OPNsense firewall through its official REST API: interfaces with link speed
  and traffic, VLANs, SFP modules, ARP, NDP, DHCP leases and pool usage, gateway
  status, VPN peers (WireGuard, OpenVPN, IPsec), services, firewall states,
  port forwards, CPU, memory, swap, load, disks, temperatures, uptime and
  pending updates.
  It sets local DNS names (Unbound or dnsmasq), wakes devices (os-wol) and
  keeps the configuration's versions; on 26.7 and later it also turns ports
  on and off, manages each
  VLAN's network (interface, gateway, DHCP range, access rules), fixed
  addresses and pausing a device's internet.
author: Omini
homepage: https://github.com/riccardoalv/omini-plugin-opnsense
changes:
  - port.enabled
  - network.set
  - network.delete
  - reservation.set
  - reservation.delete
  - dns.set
  - dns.delete
  - wol.send
  - pause.set
  - pause.delete
backup: true
fields:
  - key: url
    type: url
    label: Address
    required: true
    help: The OPNsense web interface, e.g. https://192.168.1.1
  - key: api_key
    type: string
    label: API key
    required: true
    help: >-
      System → Access → Users: create a user for Omini, give it the privileges
      listed in the plugin's README, then add an API key to it.
  - key: api_secret
    type: secret
    label: API secret
    required: true
  - key: verify_tls
    type: bool
    label: Verify the TLS certificate
    default: false
    group: Advanced
    help: OPNsense uses a self-signed certificate by default; turn this on if yours is trusted.
  - key: timeout_s
    type: int
    label: Timeout (seconds)
    default: 15
    group: Advanced
    help: How long to wait for each answer of the firewall.
